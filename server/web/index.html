<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%233ecf8e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* контраст подобран с запасом: на обычных офисных мониторах тёмные оттенки сливаются */
  --bg:#0b0d12; --surface:#151922; --surface2:#1c212c; --line:#2a3141; --line2:#384155;
  --text:#eef0f4; --muted:#a6aec0; --faint:#7d869b;
  --ok:#3ecf8e; --warn:#f5b83d; --crit:#f2555a; --info:#5b9cf6;
  --c1:#5b9cf6; --c2:#a78bfa; --c3:#3ecf8e; --c4:#f472b6; --c5:#f5b83d; --c6:#22d3ee; --c7:#fb923c; --c8:#94a3b8;
  --r:12px; --shadow:none; --hdr:rgba(10,12,16,.78);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f7f8fa; --line:#e5e8ee; --line2:#d8dde6;
    --text:#111418; --muted:#5b6475; --faint:#98a1b3;
    --ok:#12a26a; --warn:#d48806; --crit:#dc3545; --info:#2f6fe4;
    --c1:#2f6fe4; --c2:#7c3aed; --c3:#12a26a; --c4:#db2777; --c5:#d48806; --c6:#0891b2; --c7:#ea580c; --c8:#64748b;
    --shadow:0 1px 2px rgba(16,24,40,.04); --hdr:rgba(244,245,247,.82);
  }
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f7f8fa; --line:#e5e8ee; --line2:#d8dde6;
  --text:#111418; --muted:#5b6475; --faint:#98a1b3;
  --ok:#12a26a; --warn:#d48806; --crit:#dc3545; --info:#2f6fe4;
  --c1:#2f6fe4; --c2:#7c3aed; --c3:#12a26a; --c4:#db2777; --c5:#d48806; --c6:#0891b2; --c7:#ea580c; --c8:#64748b;
  --shadow:0 1px 2px rgba(16,24,40,.04); --hdr:rgba(244,245,247,.82);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num,td,.v{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover{border-color:var(--line2);background:var(--surface2)}
button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.link{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-size:12px;font-weight:500}
.link:hover{background:none;text-decoration:underline}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.spacer{flex:1}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr{max-width:1480px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.logo i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b9f5d8,var(--ok) 55%,#0b7a4f);box-shadow:0 0 14px color-mix(in srgb,var(--ok) 50%,transparent)}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.status.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.status.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.updated{font-size:12px;color:var(--faint)}

.wrap{max-width:1480px;margin:0 auto;padding:18px 24px 48px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.off{background:var(--faint)} .dot.info{background:var(--info)}
.dot.live{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* banners */
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.banners:empty{display:none}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid;font-weight:500}
.banner.warn{background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-color:color-mix(in srgb,var(--warn) 32%,var(--line))}
.banner.crit{background:color-mix(in srgb,var(--crit) 9%,var(--surface));border-color:color-mix(in srgb,var(--crit) 36%,var(--line))}
.banner.info{background:color-mix(in srgb,var(--info) 8%,var(--surface));border-color:color-mix(in srgb,var(--info) 30%,var(--line))}
.banner.muted{opacity:.55}
.banner .since{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap}
.banner button{padding:3px 10px;font-size:12px}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.kpi:hover{border-color:var(--line2)}
.kpi .l{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.ph .meta{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
.pb{padding:14px 16px}
.pb.flush{padding:4px 0}
.empty{color:var(--faint);font-size:13px;padding:14px 16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);white-space:nowrap}
.badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.badge.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.badge.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag{font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;letter-spacing:.03em}

/* bars + sparks */
.bar{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar>i.warn{background:var(--warn)} .bar>i.crit{background:var(--crit)}
.spark{display:block;width:100%;height:26px}

/* hosts */
.hhead,.hrow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) minmax(120px,1fr) 110px 120px 84px;gap:16px;align-items:center;padding:0 16px}
.hhead{padding-top:10px;padding-bottom:6px;font-size:11px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.hrow{padding-top:11px;padding-bottom:11px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.hrow:hover{background:var(--surface2)}
.hrow.down{opacity:.55}
.hname{display:flex;align-items:center;gap:9px;min-width:0}
.hname b{font-weight:600;font-size:14px}
.hname .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.mc .v{font-weight:600;font-size:14px}
.mc .v small{font-size:11px;color:var(--muted);font-weight:500}
.dk .v{font-weight:600;font-size:13px;display:flex;justify-content:space-between;margin-bottom:5px}
.two{font-size:12px;line-height:1.5;color:var(--muted);white-space:nowrap}
.two b{color:var(--text);font-weight:500}
.hl{display:none;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}

/* guests */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--faint);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px 6px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:16px} th:last-child,td:last-child{padding-right:16px}
td.r,th.r{text-align:right}
tr.off td{color:var(--faint)}
.tbl{overflow-x:auto}
.filters{display:flex;gap:4px;margin-left:auto}
.filters button{padding:3px 9px;font-size:12px}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .bar{width:70px;flex:none}

/* services */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);min-width:0}
.chk .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk .ms{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.chk.bad{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));background:color-mix(in srgb,var(--crit) 7%,var(--surface2))}
.chk.bad .ms{color:var(--crit)}

/* right column */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:13px;min-width:0}
.li:first-child{border-top:0}
.li .end{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted)}
.ev{display:grid;grid-template-columns:44px 8px 1fr;gap:10px;align-items:baseline;padding:8px 16px;border-top:1px solid var(--line);font-size:12.5px}
.ev:first-child{border-top:0}
.ev time{color:var(--faint);font-size:11.5px}
.ev .dot{width:7px;height:7px;transform:translateY(-1px)}
.events{max-height:300px;overflow:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.stat .l{font-size:11px;color:var(--muted);font-weight:500}
.stat .v{font-size:16px;font-weight:650;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--faint)}
.pool{display:grid;grid-template-columns:90px 1fr 92px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.pool .r{text-align:right;color:var(--muted);font-size:12px}
.sub-h{font-size:11px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.5);backdrop-filter:blur(2px);display:none;z-index:10}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1000px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:11;transform:translateX(100%);transition:transform .22s ease;overflow:auto}
.drawer.open{transform:none}
.drawer-in{padding:20px 24px 40px}
.drawer-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.drawer-h h3{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
.ranges{display:flex;gap:4px}
.ranges button{padding:4px 10px;font-size:12px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{padding:12px 14px 8px}
.chart-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.chart-h h4{margin:0;font-size:12.5px;font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart svg{display:block;width:100%;height:170px;overflow:visible}
.chart .grid line{stroke:var(--line)}
.chart .axis text{fill:var(--faint);font-size:10px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;min-width:130px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip .t{color:var(--muted);margin-bottom:3px}

/* modal */
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(460px,calc(100% - 32px));z-index:12;padding:20px;display:none;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.open{display:block}
.modal h3{margin:0 0 6px;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
select,input{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.row-end{display:flex;justify-content:flex-end;gap:8px}

@media (max-width:1180px){
  .layout{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .hdr,.wrap{padding-left:16px;padding-right:16px}
  .updated{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hhead{display:none}
  .hrow{grid-template-columns:1fr 1fr;gap:10px 16px}
  .hrow .hname{grid-column:1/-1}
  .hl{display:block;margin-bottom:2px}
  .charts,.info-grid{grid-template-columns:1fr 1fr}
  .charts{grid-template-columns:1fr}
  #maint span{display:none}
}
</style>
</head>
<body>
<header><div class="hdr">
  <div class="logo"><i></i>Lumen</div>
  <span class="status" id="summary"><span class="dot"></span>загрузка…</span>
  <div class="spacer"></div>
  <span class="updated num" id="updated"></span>
  <button id="maint">🔕<span> Обслуживание</span></button>
  <button id="theme" title="Тема">◐</button>
</div></header>

<div class="wrap">
  <div class="banners" id="banners"></div>
  <div class="kpis" id="kpis"></div>

  <div class="layout">
    <div class="col">
      <section class="panel" id="hosts-p">
        <div class="ph"><h3>Хосты</h3><span class="meta" id="hosts-meta"></span></div>
        <div id="hosts"></div>
      </section>
      <section class="panel" id="guests-p"></section>
      <section class="panel" id="checks-p"></section>
    </div>
    <div class="col">
      <section class="panel"><div class="ph"><h3>События</h3><span class="meta">последние 40</span></div><div class="events" id="events"></div></section>
      <section class="panel" id="ceph-p"></section>
      <section class="panel" id="patroni-p"></section>
      <section class="panel" id="backups-p"></section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"><div class="drawer-in" id="drawer-in"></div></aside>
<div class="tip" id="tip"></div>
<div class="modal" id="modal">
  <h3>Режим обслуживания</h3>
  <div class="muted" style="font-size:13px;margin-bottom:16px">Алерты по выбранной части остаются на дашборде, но в Telegram не уходят. Если проблема останется после окончания, уведомление придёт.</div>
  <div class="field"><label>Что заглушить</label><select id="m-scope"></select></div>
  <div class="field"><label>На сколько</label><div class="chips" id="m-dur"></div></div>
  <div class="field"><label>Причина (необязательно)</label><input id="m-reason" maxlength="200" placeholder="например, обновление ядра"></div>
  <div class="row-end"><button id="m-cancel">Отмена</button><button class="on" id="m-ok">Включить</button></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const fmt = {
  pct: v => v == null ? "—" : (v >= 10 ? v.toFixed(0) : v.toFixed(1)),
  bytes(v, d = 1) {
    if (v == null) return "—";
    const u = ["Б","КБ","МБ","ГБ","ТБ","ПБ"]; let i = 0;
    while (Math.abs(v) >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(v >= 100 ? 0 : d) : Math.round(v)) + " " + u[i];
  },
  rate: v => v == null ? "—" : fmt.bytes(v) + "/с",
  bits(v) {
    if (v == null) return "—";
    v *= 8; const u = ["бит/с","Кбит/с","Мбит/с","Гбит/с"]; let i = 0;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return v.toFixed(v >= 100 || i == 0 ? 0 : 1) + " " + u[i];
  },
  dur(s) {
    if (s == null) return "—";
    s = Math.floor(s);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d} д ${h} ч` : h ? `${h} ч ${m} мин` : m ? `${m} мин` : `${s} с`;
  },
  short(s) {
    s = Math.max(0, Math.floor(s));
    return s >= 86400 ? Math.floor(s / 86400) + " д" : s >= 3600 ? Math.floor(s / 3600) + " ч" : s >= 60 ? Math.floor(s / 60) + " мин" : s + " с";
  },
  ago: s => s < 60 ? "только что" : fmt.dur(s) + " назад",
  time(ts, withDate) {
    const d = new Date(ts * 1000);
    const t = d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
    return withDate ? d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"}) + " " + t : t;
  },
};
const level = (v, w, c) => v >= c ? "crit" : v >= w ? "warn" : "";
const bar = (pct, w = 80, c = 92) => `<div class="bar"><i class="${level(pct, w, c)}" style="width:${Math.min(100, Math.max(1.5, pct))}%"></i></div>`;
const lvColor = lv => css(lv == "crit" ? "--crit" : lv == "warn" ? "--warn" : "--c1");

/* --------------------------------------------------------------- sparkline */
// масштаб по данным: при CPU 5% линия не должна прилипать ко дну
function spark(points, color, floor = 10) {
  if (!points || points.length < 2) return `<svg class="spark"></svg>`;
  const W = 120, H = 26, t0 = points[0][0], t1 = points.at(-1)[0];
  const max = Math.max(floor, ...points.map(p => p[1])) * 1.15;
  const xy = points.map(([t, v]) => [(t - t0) / (t1 - t0 || 1) * W, H - 1.5 - v / max * (H - 3)]);
  const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

/* --------------------------------------------------------------- big chart */
function lineChart(el, series, opt = {}) {
  const W = el.clientWidth || 440, H = 170, L = 50, R = 8, T = 8, B = 20;
  const all = series.flatMap(s => s.points);
  if (!all.length) { el.innerHTML = `<div class="empty" style="height:${H}px;display:grid;place-items:center">нет данных</div>`; return; }
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0])) || t0 + 1;
  let max = opt.max ?? Math.max(...all.map(p => p[1])) * 1.15;
  if (!max || max <= 0) max = 1;
  const x = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
  const y = v => T + (1 - Math.min(v, max) / max) * (H - T - B);
  const yf = opt.fmt || (v => v.toFixed(0));
  let g = `<g class="grid">`;
  for (let i = 0; i <= 4; i++) g += `<line x1="${L}" x2="${W - R}" y1="${y(max * i / 4)}" y2="${y(max * i / 4)}"/>`;
  g += `</g><g class="axis">`;
  for (let i = 0; i <= 4; i += 2) g += `<text x="${L - 6}" y="${y(max * i / 4) + 3}" text-anchor="end">${yf(max * i / 4)}</text>`;
  const span = t1 - t0;
  for (let i = 0; i <= 4; i++) {
    const t = t0 + span * i / 4;
    g += `<text x="${x(t)}" y="${H - 4}" text-anchor="${i == 0 ? "start" : i == 4 ? "end" : "middle"}">${fmt.time(t, span > 86400 * 1.5)}</text>`;
  }
  g += `</g>`;
  let paths = "";
  for (const s of series) {
    if (!s.points.length) continue;
    // разрыв линии, если между точками пропуск больше 3 шагов
    let d = "", prev = null;
    for (const [t, v] of s.points) {
      d += (prev == null || t - prev > (s.step || 60) * 3 ? "M" : "L") + x(t).toFixed(1) + " " + y(v).toFixed(1);
      prev = t;
    }
    if (s.fill) paths += `<path d="${d}L${x(s.points.at(-1)[0])} ${y(0)}L${x(s.points[0][0])} ${y(0)}Z" fill="${s.color}" opacity=".1"/>`;
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}${paths}<line class="cur" y1="${T}" y2="${H - B}" stroke="${css("--faint")}" stroke-dasharray="3 3" style="display:none"/><rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.querySelector("svg"), cur = svg.querySelector(".cur"), tip = $("#tip");
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const t = t0 + ((e.clientX - r.left) * W / r.width - L) / (W - L - R) * (t1 - t0);
    let rows = "", at = null;
    for (const s of series) {
      if (!s.points.length) continue;
      let best = s.points[0];
      for (const p of s.points) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      at = at ?? best[0];
      rows += `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${esc(s.name)}</span><b class="num">${yf(best[1])}</b></div>`;
    }
    cur.setAttribute("x1", x(at)); cur.setAttribute("x2", x(at)); cur.style.display = "";
    tip.innerHTML = `<div class="t">${fmt.time(at, true)}</div>${rows}`;
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  svg.addEventListener("mouseleave", () => { cur.style.display = "none"; tip.style.display = "none"; });
}

/* --------------------------------------------------------------- render */
let DATA = null, OPEN = null, RANGE = 3600, GFILTER = "all";

const diskMax = h => Math.max(0, ...(h.disks || []).map(d => 100 * d.used / d.size));
function hostState(h) {
  if (h.age > 90) return "off";
  const m = h.metrics || {};
  return level(Math.max(m.cpu || 0, m.mem || 0, diskMax(h)), 85, 95) || "ok";
}
const panelHead = (title, extra = "", meta = "") => `<div class="ph"><h3>${title}</h3>${extra}${meta ? `<span class="meta">${meta}</span>` : ""}</div>`;
const scrollTo = id => document.getElementById(id)?.scrollIntoView({behavior: "smooth", block: "start"});

function renderKpis(d) {
  const c = d.cluster, pv = c.pve, ceph = c.ceph, pg = c.patroni, bk = c.backups;
  const checks = Object.entries(c).filter(([k]) => k.startsWith("checks:")).flatMap(([, v]) => v.items || []);
  const hostsUp = d.hosts.filter(h => h.age <= 90).length;
  const guests = (pv?.guests || []).filter(g => !g.template);
  const running = guests.filter(g => g.status == "running").length;
  const leader = pg?.members?.find(m => m.role == "leader");
  const maxLag = Math.max(0, ...(pg?.members || []).map(m => typeof m.lag == "number" ? m.lag : 0));
  const pgOk = pg && !pg.error && leader && pg.members.every(m => ["running", "streaming"].includes(m.state));
  const chkBad = checks.filter(x => !x.ok).length;
  const now = d.now, bkAges = (bk?.guests || []).map(g => now - g.last);
  const bkStale = bkAges.filter(a => a > 36 * 3600).length;
  const bkLast = bk?.guests?.length ? Math.min(...bkAges) : null;
  const cephUsed = ceph ? 100 * ceph.bytes.used / ceph.bytes.total : 0;
  const tiles = [
    ["hosts-p", "Хосты", hostsUp == d.hosts.length ? "" : "crit", `${hostsUp}<small>/${d.hosts.length}</small>`, "в сети"],
    ["guests-p", "VM и контейнеры", "", `${running}<small>/${guests.length}</small>`, "запущено"],
    ["ceph-p", "Ceph", !ceph ? "off" : ceph.health == "HEALTH_OK" ? "" : ceph.health == "HEALTH_ERR" ? "crit" : "warn",
      ceph ? esc(ceph.health.replace("HEALTH_", "")) : "—", ceph ? `занято ${cephUsed.toFixed(0)}% · ${ceph.osd.up}/${ceph.osd.total} OSD` : "нет данных"],
    ["patroni-p", "PostgreSQL", !pg ? "off" : pgOk ? "" : "crit", leader ? esc(leader.name) : "нет лидера", leader ? `лидер · лаг ${fmt.bytes(maxLag)}` : esc(pg?.error || "")],
    ["checks-p", "Сервисы", !checks.length ? "off" : chkBad ? "crit" : "", checks.length ? `${checks.length - chkBad}<small>/${checks.length}</small>` : "—", chkBad ? `${chkBad} не отвечает` : "отвечают"],
    ["backups-p", "Бэкапы", !bk ? "off" : bkStale ? "warn" : "", bkLast != null ? fmt.short(bkLast) + " <small>назад</small>" : "—", bk ? (bkStale ? `${bkStale} устарели` : `все ${bkAges.length} свежие`) : "нет данных"],
  ];
  $("#kpis").innerHTML = tiles.map(([id, l, lv, v, s]) => `<div class="kpi" data-to="${id}">
      <div class="l"><span class="dot ${lv}"></span>${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  document.querySelectorAll(".kpi").forEach(k => k.onclick = () => scrollTo(k.dataset.to));
}

function renderHosts(d) {
  $("#hosts-meta").textContent = "нажми на строку, чтобы открыть графики";
  if (!d.hosts.length) { $("#hosts").innerHTML = `<div class="empty">Агенты ещё не прислали данные</div>`; return; }
  const head = `<div class="hhead"><span>Хост</span><span>CPU · 1 ч</span><span>Память · 1 ч</span><span>Диск</span><span>Сеть</span><span>Load</span></div>`;
  $("#hosts").innerHTML = head + d.hosts.map(h => {
    const m = h.metrics || {}, st = hostState(h), i = h.info || {};
    const dm = diskMax(h), worst = (h.disks || []).reduce((a, x) => !a || x.used / x.size > a.used / a.size ? x : a, null);
    const cpuLv = level(m.cpu || 0, 85, 95), memLv = level(m.mem || 0, 85, 95);
    const silenced = d.silences.some(x => x.scope == "all" || x.scope == "host:" + h.name);
    return `<div class="hrow ${st == "off" ? "down" : ""}" data-host="${esc(h.name)}">
      <div class="hname"><span class="dot ${st == "ok" ? "" : st}"></span><div style="min-width:0">
        <b>${esc(h.name)}</b>${silenced ? " 🔕" : ""}
        <div class="sub">${st == "off" ? "нет связи " + fmt.ago(h.age) : `${i.cpus ?? "?"} vCPU · ${fmt.bytes(m.mem_total, 0)} · up ${fmt.short(i.uptime || 0)}`}</div></div></div>
      <div><div class="hl">CPU</div><div class="mc"><span class="v">${fmt.pct(m.cpu)}<small>%</small></span>${spark(h.spark.cpu, lvColor(cpuLv))}</div></div>
      <div><div class="hl">Память</div><div class="mc"><span class="v">${fmt.pct(m.mem)}<small>%</small></span>${spark(h.spark.mem, memLv ? lvColor(memLv) : css("--c2"), 20)}</div></div>
      <div class="dk" title="${esc((h.disks || []).map(x => `${x.mount}: ${(100 * x.used / x.size).toFixed(0)}% из ${fmt.bytes(x.size, 0)}`).join("\n"))}">
        <div class="hl">Диск</div><div class="v"><span>${(h.disks || []).length > 1 ? "макс." : esc(worst?.mount || "")}</span><span class="num">${dm.toFixed(0)}%</span></div>${bar(dm, 85, 95)}</div>
      <div class="two"><div class="hl">Сеть</div>↓ <b>${fmt.bits(m.net_rx)}</b><br>↑ <b>${fmt.bits(m.net_tx)}</b></div>
      <div class="two"><div class="hl">Load</div><b>${m.load1 != null ? m.load1.toFixed(2) : "—"}</b>${m.temp != null ? `<br>${m.temp.toFixed(0)} °C` : m.iowait != null ? `<br>io ${m.iowait.toFixed(1)}%` : ""}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".hrow").forEach(el => el.onclick = () => openHost(el.dataset.host));
}

function renderGuests(pv) {
  const el = $("#guests-p");
  if (!pv) { el.innerHTML = panelHead("Виртуальные машины и контейнеры") + `<div class="empty">нет данных Proxmox</div>`; return; }
  const nodes = pv.nodes.map(n => n.name).sort();
  const opts = [["all", "все"], ...nodes.map(n => [n, n]), ["stopped", "остановленные"]];
  let guests = pv.guests.filter(g => !g.template);
  if (GFILTER == "stopped") guests = guests.filter(g => g.status != "running");
  else if (GFILTER != "all") guests = guests.filter(g => g.node == GFILTER);
  const rows = guests.map(g => {
    const run = g.status == "running", mem = g.maxmem ? 100 * g.mem / g.maxmem : 0, cpu = 100 * (g.cpu || 0);
    return `<tr class="${run ? "" : "off"}">
      <td class="faint">${g.vmid}</td>
      <td><b style="font-weight:600">${esc(g.name)}</b> <span class="tag">${g.type == "lxc" ? "CT" : "VM"}</span></td>
      <td class="muted">${esc(g.node)}</td>
      <td><span class="dot ${run ? "" : "off"}" style="width:7px;height:7px;margin-right:6px"></span>${run ? "работает" : esc(g.status)}</td>
      <td>${run ? `<div class="minibar">${bar(cpu, 80, 95)}<span class="muted">${cpu.toFixed(0)}%</span></div>` : ""}</td>
      <td>${run ? `<div class="minibar">${bar(mem, 85, 95)}<span class="muted">${fmt.bytes(g.mem)} / ${fmt.bytes(g.maxmem, 0)}</span></div>` : ""}</td>
      <td class="r muted">${run ? fmt.dur(g.uptime) : ""}</td></tr>`;
  }).join("");
  const offline = pv.nodes.filter(n => n.status != "online").map(n => `<span class="badge crit">${esc(n.name)} offline</span>`).join("");
  el.innerHTML = panelHead("Виртуальные машины и контейнеры", offline +
      `<div class="filters">${opts.map(([v, l]) => `<button data-f="${esc(v)}" class="${v == GFILTER ? "on" : ""}">${l}</button>`).join("")}</div>`) +
    `<div class="tbl"><table><tr><th>ID</th><th>Имя</th><th>Узел</th><th>Статус</th><th>CPU</th><th>Память</th><th class="r">Аптайм</th></tr>
      ${rows || `<tr><td colspan="7" class="faint">ничего не найдено</td></tr>`}</table></div>`;
  el.querySelectorAll(".filters button").forEach(b => b.onclick = () => { GFILTER = b.dataset.f; renderGuests(DATA.cluster.pve); });
}

function renderChecks(cl) {
  const el = $("#checks-p");
  const all = Object.entries(cl).filter(([k]) => k.startsWith("checks:"))
    .flatMap(([k, v]) => (v.items || []).map(c => ({...c, src: k.slice(7), age: v._age})));
  if (!all.length) { el.innerHTML = panelHead("Сервисы") + `<div class="empty">Проверки не настроены: добавь модуль "checks" и список "checks" в agent.json</div>`; return; }
  all.sort((a, b) => a.ok - b.ok || a.name.localeCompare(b.name));
  const bad = all.filter(c => !c.ok).length;
  el.innerHTML = panelHead("Сервисы", `<span class="badge ${bad ? "crit" : ""}">${bad ? bad + " не отвечает" : "все отвечают"}</span><button class="link" onclick="openCluster('checks')">время ответа →</button>`,
      `с ${esc([...new Set(all.map(c => c.src))].join(", "))} · ${fmt.ago(all[0].age)}`) +
    `<div class="pb"><div class="checks">${all.map(c => `<div class="chk ${c.ok ? "" : "bad"}" title="${esc(c.type.toUpperCase() + " · " + c.target + (c.code ? " · " + c.code : ""))}">
      <span class="dot ${c.ok ? "" : "crit"}"></span><span class="n">${esc(c.name)}</span>
      <span class="ms num">${c.ok ? (c.ms != null ? (c.ms < 10 ? c.ms.toFixed(1) : Math.round(c.ms)) + " мс" : "ok") : esc(c.err || "ошибка")}</span></div>`).join("")}</div></div>`;
}

function renderCeph(c) {
  const el = $("#ceph-p");
  if (!c) { el.innerHTML = panelHead("Ceph") + `<div class="empty">нет данных</div>`; return; }
  const hl = c.health == "HEALTH_OK" ? "" : c.health == "HEALTH_ERR" ? "crit" : "warn";
  const used = c.bytes.used / c.bytes.total * 100;
  const lat = c.osd_lat ? Object.entries(c.osd_lat).sort((a, b) => b[1] - a[1])[0] : null;
  const pgsBad = c.pgs.states.filter(s => s.state_name != "active+clean");
  el.innerHTML = panelHead("Ceph", `<span class="badge ${hl}">${esc(c.health)}</span><button class="link" onclick="openCluster('ceph')">графики →</button>`, fmt.ago(c._age)) +
    `<div class="pb">
      ${c.checks.map(x => `<div class="banner ${x.severity == "HEALTH_ERR" ? "crit" : "warn"}" style="margin-bottom:10px;font-size:12.5px">${esc(x.msg)}</div>`).join("")}
      <div class="stats">
        <div class="stat"><div class="l">OSD</div><div class="v num">${c.osd.up}/${c.osd.total} <span class="faint" style="font-size:12px;font-weight:500">up</span></div><div class="s">${lat ? `макс. задержка ${lat[1]} мс` : `${c.osd.in} in`}</div></div>
        <div class="stat"><div class="l">PG</div><div class="v num">${c.pgs.total}</div><div class="s">${pgsBad.length ? esc(pgsBad.map(s => s.count + " " + s.state_name).join(", ")) : "все active+clean"}</div></div>
        <div class="stat"><div class="l">Чтение</div><div class="v num">${fmt.rate(c.io.rd)}</div><div class="s">${c.io.rd_ops} оп/с</div></div>
        <div class="stat"><div class="l">Запись</div><div class="v num">${fmt.rate(c.io.wr)}</div><div class="s">${c.io.wr_ops} оп/с</div></div>
      </div>
      <div class="pool" style="font-weight:600"><span>Всего</span>${bar(used, 75, 85)}<span class="r num">${used.toFixed(0)}% · ${fmt.bytes(c.bytes.total, 0)}</span></div>
      ${c.pools.map(p => `<div class="pool"><span class="muted">${esc(p.name)}</span>${bar(p.pct, 75, 85)}<span class="r num">${fmt.bytes(p.stored)}</span></div>`).join("")}
    </div>`;
}

function renderPatroni(p) {
  const el = $("#patroni-p");
  if (!p) { el.innerHTML = panelHead("PostgreSQL") + `<div class="empty">нет данных</div>`; return; }
  const ok = !p.error && p.members?.some(m => m.role == "leader") && p.members.every(m => ["running", "streaming"].includes(m.state));
  const members = (p.members || []).map(m => {
    const good = ["running", "streaming"].includes(m.state);
    return `<div class="li"><span class="dot ${good ? "" : "crit"}"></span><b style="font-weight:600">${esc(m.name)}</b>
      ${m.role == "leader" ? `<span class="badge">лидер</span>` : `<span class="badge mute">${esc(m.role)}</span>`}
      <span class="faint" style="font-size:12px">${esc(m.host)}</span>
      <span class="end">${good ? "" : `<span class="badge crit">${esc(m.state)}</span> `}${m.role == "leader" ? "TL " + (m.timeline ?? "—") : "лаг " + (m.lag == null ? "—" : fmt.bytes(m.lag))}</span></div>`;
  }).join("");
  const etcd = Object.entries(p.etcd || {}).map(([ep, s]) => `<div class="li"><span class="dot ${s.ok ? "" : "crit"}"></span><span>${esc(ep.split(":")[0])}</span>
      <span class="end num">${s.ok ? `ответ ${s.ms} мс · fsync ${s.fsync_ms != null ? `<b style="color:${s.fsync_ms > 100 ? "var(--warn)" : "var(--text)"};font-weight:500">${s.fsync_ms.toFixed(1)} мс</b>` : "—"}` : `<span style="color:var(--crit)">${esc(s.err || "fail")}</span>`}</span></div>`).join("");
  el.innerHTML = panelHead("PostgreSQL", `<span class="badge ${ok ? "" : "crit"}">${ok ? "OK" : "проблема"}</span><button class="link" onclick="openCluster('patroni')">графики →</button>`, esc(p.scope || "")) +
    (p.error ? `<div class="banner crit" style="margin:12px 16px 0">${esc(p.error)}</div>` : "") +
    `<div class="list" style="padding:4px 0">${members}</div><div class="sub-h">etcd</div><div class="list" style="padding-bottom:4px">${etcd}</div>`;
}

function renderBackups(b, pv) {
  const el = $("#backups-p");
  if (!b) { el.innerHTML = panelHead("Бэкапы") + `<div class="empty">нет данных</div>`; return; }
  const now = Date.now() / 1000;
  const names = Object.fromEntries((pv?.guests || []).map(g => [g.vmid, g.name]));
  const rows = [...b.guests].sort((a, c) => a.last - c.last).map(g => {
    const age = now - g.last, lv = age > 36 * 3600 ? "crit" : age > 26 * 3600 ? "warn" : "";
    return `<div class="li"><span class="faint num" style="width:28px">${g.vmid}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(names[g.vmid] || g.name)}</span>
      <span class="end num"><span style="color:${lv ? `var(--${lv})` : "var(--text)"}">${fmt.short(age)} назад</span> · ${fmt.bytes(g.size, 0)}${g.verified == "ok" ? " · ✓" : g.verified ? ` · <span style="color:var(--crit)">${esc(g.verified)}</span>` : ""}</span></div>`;
  }).join("");
  const tasks = b.tasks.slice(0, 4).map(t => `<div class="ev"><time class="num">${fmt.time(t.starttime, true).split(" ")[0]}</time>
      <span class="dot ${t.status == "OK" ? "" : t.status ? "crit" : "warn"}"></span>
      <span>${esc(t.node)} · ${t.status == "OK" ? "успешно" : t.status ? `<span style="color:var(--crit)">${esc(t.status)}</span>` : "идёт…"} <span class="faint">${t.endtime ? "· " + fmt.dur(t.endtime - t.starttime) : ""}</span></span></div>`).join("");
  el.innerHTML = panelHead("Бэкапы", `<span class="badge mute">${esc(b.storage)}</span>`, fmt.ago(b._age)) +
    `<div class="list" style="padding:4px 0">${rows || `<div class="empty">нет копий</div>`}</div>
     <div class="sub-h">Задания vzdump</div><div style="padding-bottom:6px">${tasks || `<div class="empty">нет</div>`}</div>`;
}

function render(d) {
  DATA = d;
  const live = d.alerts.filter(a => !a.muted);
  const crit = live.filter(a => a.level == "crit").length, warn = live.length - crit;
  const sum = $("#summary");
  sum.className = "status " + (crit ? "crit" : warn ? "warn" : "");
  sum.innerHTML = live.length
    ? `<span class="dot ${crit ? "crit" : "warn"}"></span>${[crit && crit + " критич.", warn && warn + " предупр."].filter(Boolean).join(" · ")}`
    : `<span class="dot live"></span>Всё в порядке`;
  $("#updated").textContent = "обновлено " + new Date(d.now * 1000).toLocaleTimeString("ru-RU");
  $("#banners").innerHTML =
    d.silences.map(x => `<div class="banner info">🔕 <span><b>${esc(x.label)}</b> — обслуживание ещё ${fmt.dur(x.until - d.now)}${x.reason ? ` <span class="muted" style="font-weight:400">· ${esc(x.reason)}</span>` : ""}</span><button style="margin-left:auto" data-sid="${esc(x.id)}">Снять</button></div>`).join("") +
    d.alerts.map(a => `<div class="banner ${a.level} ${a.muted ? "muted" : ""}"><span class="dot ${a.level}"></span>${a.muted ? "🔕 " : ""}${esc(a.msg)}<span class="since">${fmt.ago(d.now - a.since)}</span></div>`).join("");
  document.querySelectorAll("#banners button[data-sid]").forEach(b => b.onclick = () => api("api/silence/delete", {id: b.dataset.sid}));
  renderKpis(d);
  renderHosts(d);
  renderGuests(d.cluster.pve);
  renderChecks(d.cluster);
  renderCeph(d.cluster.ceph);
  renderPatroni(d.cluster.patroni);
  renderBackups(d.cluster.backups, d.cluster.pve);
  $("#events").innerHTML = d.events.map(e => `<div class="ev"><time class="num">${fmt.time(e.ts, d.now - e.ts > 86400)}</time><span class="dot ${e.level}"></span><span>${esc(e.msg)}</span></div>`).join("") || `<div class="empty">пока тихо</div>`;
}

/* --------------------------------------------------------------- drawers */
const RANGES = [[3600, "1ч"], [6 * 3600, "6ч"], [86400, "24ч"], [7 * 86400, "7д"], [30 * 86400, "30д"]];
const rangeBtns = () => `<div class="ranges">${RANGES.map(([r, l]) => `<button data-r="${r}" class="${r == RANGE ? "on" : ""}">${l}</button>`).join("")}</div><button id="close">✕</button>`;
function bindDrawer() {
  $("#close").onclick = closeDrawer;
  document.querySelectorAll(".ranges button").forEach(b => b.onclick = () => { RANGE = +b.dataset.r; drawOpen(); });
}
function openDrawer(key) {
  OPEN = key;
  $("#overlay").classList.add("open"); $("#drawer").classList.add("open");
  drawOpen();
}
const openHost = name => openDrawer(name);
const openCluster = kind => openDrawer("@" + kind);
function closeDrawer() {
  OPEN = null;
  $("#overlay").classList.remove("open"); $("#drawer").classList.remove("open");
}
const drawOpen = () => OPEN && (OPEN[0] == "@" ? drawCluster(OPEN.slice(1)) : drawHost());

async function drawHost() {
  const name = OPEN, h = DATA.hosts.find(x => x.name == name);
  if (!h) return;
  const i = h.info || {}, m = h.metrics || {};
  const disks = (h.disks || []).map(d => "disk:" + d.mount);
  const st = hostState(h);
  $("#drawer-in").innerHTML = `
    <div class="drawer-h"><span class="dot ${st == "ok" ? "" : st}"></span><h3>${esc(name)}</h3>
      <span class="muted">${esc(i.os || "")} · ${esc(i.kernel || "")}</span><span class="spacer"></span>${rangeBtns()}</div>
    <div class="info-grid">
      <div class="stat"><div class="l">Аптайм</div><div class="v num">${fmt.dur(i.uptime)}</div></div>
      <div class="stat"><div class="l">CPU</div><div class="v num">${i.cpus ?? "—"} ядер</div></div>
      <div class="stat"><div class="l">Память</div><div class="v num">${fmt.bytes(m.mem_used)} / ${fmt.bytes(m.mem_total, 0)}</div></div>
      <div class="stat"><div class="l">Swap</div><div class="v num">${fmt.pct(m.swap)}%</div></div>
    </div>
    <div class="charts">
      ${[["cpu", "CPU"], ["mem", "Память"], ["net", "Сеть"], ["io", "Диск I/O"], ["load", "Load average"], ["disk", m.temp != null ? "Температура и заполнение дисков" : "Заполнение дисков"]]
        .map(([id, t]) => `<div class="panel chart"><div class="chart-h"><h4>${t}</h4><div class="legend" id="lg-${id}"></div></div><div id="ch-${id}"></div></div>`).join("")}
    </div>`;
  bindDrawer();
  const metrics = ["cpu", "iowait", "mem", "swap", "net_rx", "net_tx", "disk_r", "disk_w", "load1", "temp", ...disks];
  const r = await fetch(`api/history?host=${encodeURIComponent(name)}&range=${RANGE}&metrics=${encodeURIComponent(metrics.join(","))}`).then(r => r.json());
  if (OPEN != name) return;
  const S = (key, label, color, fill) => ({name: label, color, fill, points: r[key]?.points || [], step: r[key]?.step});
  const C = [1, 2, 3, 4, 5].map(k => css("--c" + k));
  const draw = (id, series, opt) => {
    series = series.filter(s => s.points.length);
    $("#lg-" + id).innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
    lineChart($("#ch-" + id), series, opt);
  };
  const pct = {max: 100, fmt: v => v.toFixed(0) + "%"};
  draw("cpu", [S("cpu", "CPU", C[0], true), S("iowait", "iowait", C[4])], pct);
  draw("mem", [S("mem", "RAM", C[1], true), S("swap", "swap", C[3])], pct);
  draw("net", [S("net_rx", "вход", C[2], true), S("net_tx", "выход", C[0])], {fmt: fmt.bits});
  draw("io", [S("disk_r", "чтение", C[0], true), S("disk_w", "запись", C[3])], {fmt: fmt.rate});
  draw("load", [S("load1", "1 мин", C[4], true)], {fmt: v => v.toFixed(1)});
  draw("disk", [...(m.temp != null ? [S("temp", "°C", C[3])] : []), ...disks.map((d, k) => S(d, d.slice(5), C[k % 3]))], pct);
}

const CLUSTER = {
  ceph: {title: "Ceph", group: "_ceph", charts: [
    {id: "osd", title: "Задержка записи OSD (commit)", pick: m => m.startsWith("osd."), fmt: v => v.toFixed(0) + " мс", wide: true},
    {id: "io", title: "Пропускная способность", pick: m => m == "io_rd" || m == "io_wr", label: m => m == "io_rd" ? "чтение" : "запись", fmt: v => fmt.rate(v)},
    {id: "ops", title: "Операции в секунду", pick: m => m == "ops_rd" || m == "ops_wr", label: m => m == "ops_rd" ? "чтение" : "запись", fmt: v => v.toFixed(0)},
  ]},
  patroni: {title: "Patroni и etcd", group: "_etcd", charts: [
    {id: "fsync", title: "etcd: fsync WAL (среднее за интервал)", pick: m => m.startsWith("fsync:"), label: m => m.slice(6), fmt: v => v.toFixed(1) + " мс"},
    {id: "commit", title: "etcd: commit backend", pick: m => m.startsWith("commit:"), label: m => m.slice(7), fmt: v => v.toFixed(1) + " мс"},
    {id: "rtt", title: "etcd: время ответа /health", pick: m => m.startsWith("rtt:"), label: m => m.slice(4), fmt: v => v.toFixed(1) + " мс"},
    {id: "lag", title: "Лаг репликации PostgreSQL", pick: m => m.startsWith("lag:"), label: m => m.slice(4), fmt: v => fmt.bytes(v)},
  ]},
  checks: {title: "Время ответа сервисов", group: "_checks", charts: [
    {id: "chk", title: "Время ответа", pick: () => true, fmt: v => v.toFixed(0) + " мс", wide: true},
  ]},
};
async function drawCluster(kind) {
  const cfg = CLUSTER[kind], key = OPEN;
  $("#drawer-in").innerHTML = `
    <div class="drawer-h"><h3>${esc(cfg.title)}</h3><span class="spacer"></span>${rangeBtns()}</div>
    <div class="charts">${cfg.charts.map(c => `<div class="panel chart" ${c.wide ? 'style="grid-column:1/-1"' : ""}><div class="chart-h"><h4>${esc(c.title)}</h4><div class="legend" id="lg-${c.id}"></div></div><div id="ch-${c.id}"></div></div>`).join("")}</div>`;
  bindDrawer();
  const names = await fetch(`api/metrics?host=${cfg.group}`).then(r => r.json());
  const r = names.length ? await fetch(`api/history?host=${cfg.group}&range=${RANGE}&metrics=${encodeURIComponent(names.join(","))}`).then(r => r.json()) : {};
  if (OPEN != key) return;
  const C = [1, 2, 3, 4, 5, 6, 7, 8].map(i => css("--c" + i));
  for (const c of cfg.charts) {
    const ms = names.filter(c.pick);
    const series = ms.map((m, i) => ({name: c.label ? c.label(m) : m, color: C[i % C.length], points: r[m]?.points || [], step: r[m]?.step, fill: ms.length == 1}))
      .filter(x => x.points.length);
    $("#lg-" + c.id).innerHTML = series.map(x => `<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join("");
    lineChart($("#ch-" + c.id), series, {fmt: c.fmt});
  }
}

/* --------------------------------------------------------------- maintenance */
async function api(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Lumen": "1"}, body: JSON.stringify(body)});
  if (!r.ok) alert("Ошибка: " + (await r.text()));
  refresh();
}
const DURS = [[30, "30 мин"], [60, "1 ч"], [120, "2 ч"], [240, "4 ч"], [1440, "сутки"]];
let DUR = 60;
function openMaint() {
  if (!DATA) return;
  const opts = [["all", "Весь кластер"], ...DATA.hosts.map(h => ["host:" + h.name, "Хост " + h.name]),
                ["ceph", "Ceph"], ["patroni", "Patroni и etcd"], ["checks", "Проверки сервисов"], ["backups", "Бэкапы"]];
  $("#m-scope").innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  const drawDur = () => {
    $("#m-dur").innerHTML = DURS.map(([m, l]) => `<button data-m="${m}" class="${m == DUR ? "on" : ""}">${l}</button>`).join("");
    document.querySelectorAll("#m-dur button").forEach(b => b.onclick = () => { DUR = +b.dataset.m; drawDur(); });
  };
  drawDur();
  $("#m-reason").value = "";
  $("#modal").classList.add("open"); $("#overlay").classList.add("open");
}
function closeMaint() { $("#modal").classList.remove("open"); if (!OPEN) $("#overlay").classList.remove("open"); }
$("#maint").onclick = openMaint;
$("#m-cancel").onclick = closeMaint;
$("#m-ok").onclick = async () => {
  await api("api/silence", {scope: $("#m-scope").value, minutes: DUR, reason: $("#m-reason").value.trim()});
  closeMaint();
};
$("#overlay").onclick = () => { closeMaint(); closeDrawer(); };
addEventListener("keydown", e => { if (e.key == "Escape") { closeMaint(); closeDrawer(); } });

/* --------------------------------------------------------------- theme + loop */
const THEMES = ["auto", "dark", "light"];
function applyTheme(t) {
  if (t == "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("#theme").title = "Тема: " + {auto: "как в системе", dark: "тёмная", light: "светлая"}[t];
}
let theme = new URLSearchParams(location.search).get("theme");
if (!THEMES.includes(theme)) { try { theme = localStorage.getItem("lumen-theme") || "auto"; } catch (e) { theme = "auto"; } }
applyTheme(theme);
$("#theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem("lumen-theme", theme); } catch (e) {}
  applyTheme(theme);
  if (DATA) { render(DATA); drawOpen(); }
};

let tick = 0;
async function refresh() {
  try {
    render(await fetch("api/overview").then(r => r.json()));
    if (OPEN && ++tick % 3 == 0) drawOpen();
  } catch (e) {
    $("#summary").className = "status crit";
    $("#summary").innerHTML = `<span class="dot crit"></span>сервер недоступен`;
  }
}
refresh();
setInterval(refresh, 10000);
let rs; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(drawOpen, 200); });
</script>
</body>
