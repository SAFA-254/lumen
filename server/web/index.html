<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omega Luxmon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%233ecf8e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body class="entering">
<svg style="display:none" aria-hidden="true">
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.300 21.300 0 0 0 .6 5M17 17H3s3-2 3-9a4.700 4.700 0 0 1 .3-1.700M10.300 21a1.940 1.940 0 0 0 3.400 0M2 2l20 20"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-wall" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-temp" viewBox="0 0 24 24"><path d="M14 14.760V3.500a2.500 2.500 0 0 0-5 0v11.260a4.500 4.500 0 1 0 5 0z"/></symbol>
  <symbol id="i-update" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.600-6.400L21 8M21 3v5h-5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.600-6.400L3 8M3 3v5h5"/></symbol>
  <symbol id="i-backup" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.700 4 3 9 3s9-1.300 9-3V5M3 12c0 1.700 4 3 9 3s9-1.300 9-3"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></symbol>
  <symbol id="i-node" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><path d="M22 12H2M5.500 5.100 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.500-6.900A2 2 0 0 0 16.800 4H7.200a2 2 0 0 0-1.700 1.100zM6 16h.01M10 16h.01"/></symbol>
  <symbol id="i-net" viewBox="0 0 24 24"><path d="M2 8.800a15 15 0 0 1 20 0M5 12.500a10 10 0 0 1 14 0M8.500 16a5 5 0 0 1 7 0M12 20h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.300 3.900 1.800 18a2 2 0 0 0 1.700 3h17a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0zM12 9v4M12 17h.01"/></symbol>
</svg>
<header><div class="hdr">
  <div class="logo"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M17 2c1 6 8 9 8 17a9 9 0 0 1-18 0c0-4 2-7 4-9 .3 2.300 1 3.700 2.300 4.500C13 10 14 6 17 2z"/></svg>Luxmon</div>
  <span class="status" id="summary"><span class="dot"></span>загрузка…</span>
  <div class="spacer"></div>
  <span class="updated num" id="updated"></span>
  <button id="find" title="Поиск: хост, VM, раздел (Ctrl+K)"><svg class="ic"><use href="#i-search"/></svg><span class="kbd">Ctrl K</span></button>
  <button id="maint" class="admin-only"><svg class="ic"><use href="#i-mute"/></svg><span>Обслуживание</span></button>
  <button id="settings" class="admin-only" title="Настройки"><svg class="ic"><use href="#i-sliders"/></svg></button>
  <button id="wall" title="Режим для экрана на стене"><svg class="ic"><use href="#i-wall"/></svg></button>
  <button id="lang" title="Язык интерфейса / Interface language">EN</button>
  <button id="theme" title="Тема"><svg class="ic"><use href="#i-theme"/></svg></button>
  <span id="userbox"></span>
</div></header>

<div class="wrap">
  <div id="hero"></div>
  <div class="banners" id="banners"></div>
  <div class="kpis" id="kpis"></div>

  <div class="layout">
    <div class="col" id="col-l">
      <section class="panel" id="map-p"></section>
      <section class="panel" id="hosts-p">
        <div class="ph"><h3>Хосты</h3><button class="link" data-open="@agents">агенты и токены →</button><span class="meta" id="hosts-meta"></span></div>
        <div id="hosts"></div>
      </section>
      <section class="panel" id="guests-p"></section>
      <section class="panel" id="checks-p"></section>
      <section class="panel" id="disks-p"></section>
    </div>
    <div class="col" id="col-r">
      <section class="panel" id="events-p"><div class="ph"><h3>События</h3><button class="link" data-open="@history">история алертов →</button><span class="meta">последние 40</span></div><div class="events" id="events"></div></section>
      <section class="panel" id="ceph-p"></section>
      <section class="panel" id="patroni-p"></section>
      <section class="panel" id="logs-p"></section>
      <section class="panel" id="backups-p"></section>
      <section class="panel" id="ssh-p"></section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"><div class="drawer-in" id="drawer-in"></div></aside>
<div class="tip" id="tip"></div>
<div class="modal pal" id="pal" role="dialog" aria-label="Поиск">
  <input id="pal-q" placeholder="Хост, VM, раздел или действие…" autocomplete="off" spellcheck="false">
  <div id="pal-l"></div>
</div>
<div class="modal" id="modal">
  <h3>Режим обслуживания</h3>
  <div class="muted" style="font-size:13px;margin-bottom:16px">Алерты по выбранной части остаются на дашборде, но в Telegram не уходят. Если проблема останется после окончания, уведомление придёт.</div>
  <div class="field"><label>Что заглушить</label><select id="m-scope"></select></div>
  <div class="field"><label>На сколько</label><div class="chips" id="m-dur"></div></div>
  <div class="field"><label>Причина (необязательно)</label><input id="m-reason" maxlength="200" placeholder="например, обновление ядра"></div>
  <div class="row-end"><button id="m-cancel">Отмена</button><button class="on" id="m-ok">Включить</button></div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
